    <style>
      .tabellone {
        width: fit-content;
        margin-bottom: 1rem;
        display: grid;
        grid-template-columns: repeat(2, auto);
        grid-template-rows: repeat(3, auto);
        border: 1px solid black;
        padding: 5px;
        gap: 1px;
      }

      .cartella {
        /* border: 1px solid #333; */
        width: fit-content;
        font-family: "Libre Bodoni", serif;
        font-size: 1.2rem;
        border-radius: 5px;
        box-shadow: 1px 1px 5px LightGray;
        /* padding: 15px; */
      }

      .cartella-header {
        display: flex;
        justify-content: center;
        align-items: center;
        /* border: 1px solid black;  */
        margin: 5px;
        /* margin-top: 15px; */
        /* margin-bottom: 15px; */
      }

      .cartella-header input {
        text-align: center;
        border: none;
        font-family: inherit;
        font-size: inherit;
        background-color: WhiteSmoke;
        border-radius: 5px;
        box-shadow: 1px 1px 5px gray;
      }
      .cartella-griglia {
        display: grid;
        grid-template-columns: repeat(5, minmax(40px, 1fr));
        grid-template-rows: repeat(3, minmax(40px, 1fr));
        gap: 5px;
        text-align: center;
        margin: 5px;
        opacity: 0.9;
        background-color: white;
      }

      .cartella-griglia > div {
        border: 1px solid #333;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 20px;
        box-shadow: 1px 1px 5px gray;
      }

      .cartella-griglia > div.estratto {
        background: yellow;
        font-weight: bold;
      }
    </style>
  </head>
