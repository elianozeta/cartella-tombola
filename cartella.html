	<style>
		.oggetto_nascosto {display:none;}

		table.numeri_scelti, table.cartella {font-family:'Libre Bodoni',serif; font-size:1.5rem; padding:5px; text-align:center;border: 1px solid black; border-spacing: 5px; display: inline-block; margin:5px; opacity:0.90; background-color:white; border-radius:10px;}
		table.numeri_scelti {border: 0px solid black; }
		/* table.cartella td {border: 1px solid black; font-size:2rem; padding: 5px;border-radius:50px;box-shadow: 1px 1px 5px gray; min-width: 10px; background-color:inherit;} */
		table.cartella td, table.numeri_scelti td {border: 1px solid black; padding: 5px;border-radius:50px;box-shadow: 1px 1px 5px gray; min-width: 50px; background-color:inherit;}
		table.cartella input, table.numeri_scelti input {border: 0px solid black; font-family:'Libre Bodoni',serif; font-size:1.5rem; text-align:center; background-color:inherit; width: 100%;}
		@keyframes bordercolor {from {border:10px solid red;} 25% {border:10px solid gold;} 50% {border:10px solid green;} 75% {border:10px solid blue;} to {border:10px solid red;}}
		@keyframes shadowcolor {from {box-shadow: 2px 2px 2px gray;} 50% {box-shadow: 3px 3px 3px silver;} to {box-shadow: 2px 2px px gray;}}
		@keyframes backgroundcolor {from {background-color: white;} to {background-color: red;}}
		@keyframes tombola {from {background-image: linear-gradient(135deg, GoldenRod, gold, GoldenRod);} 33% {background-image: linear-gradient(135deg, GoldenRod, GoldenRod, gold);} 66% {background-image: linear-gradient(135deg, gold, GoldenRod, GoldenRod);} to {background-image: linear-gradient(135deg, GoldenRod, gold, GoldenRod);}}
	</style>

<script type="text/javascript" language="javascript"><!--
//<![CDATA[
	document.getElementById('numeri_casuali').addEventListener('click', numeri_casuali);
	var numeri = [];
	var tutte_le_decine = false;
	function numeri_casuali() {
		numeri = [];
		tutte_le_decine = false;
		while (numeri.length < 15) {
			let num = Math.floor(Math.random() * 90) + 1;
			if (numero_premesso(num)) {
				numeri.push(num);
			}
		}
		let map_cartella = {};
		for (let i = 0; i < numeri.length; i++) {
			chiave = colonna(numeri[i]);
			if (!map_cartella[chiave]) {
		        map_cartella[chiave] = [];
		    }
			map_cartella[chiave].push(numeri[i]);
		}
		// pulisco la cartella
		var campi_da_pulire = document.getElementById('cartella').querySelectorAll('input');
		for (let campo of campi_da_pulire) {
			if (campo.id != "cartiglio") {
				campo.value = "";
			}
		}
		campi_da_pulire = document.getElementById('cartella').querySelectorAll('td');
		for (let campo of campi_da_pulire) {
			if (campo.id.slice(0,12) != "td_cartiglio") {
				campo.innerHTML = "";
			}
		}

		let riga_inizio = 0;
		let contatore_riga = [["0",0], ["1",0], ["2",0]];
		for (let chiave in map_cartella) {
			let righe_scelte = scegli_righe(contatore_riga, map_cartella[chiave].length);
			map_cartella[chiave].sort();
			for (let i = 0; i < map_cartella[chiave].length; i++) {
				let id = righe_scelte[i][0]+chiave;
				campo = document.getElementById(id);
				if (campo.tagName == "TD") {
					// se è una TD la riempio direttamente
					campo.innerHTML = map_cartella[chiave][i];
				} else {
					document.getElementById(id).value = map_cartella[chiave][i];
				}
				contatore_riga[Number(righe_scelte[i][0])][1]++;
			}
		}
	}
	function numero_premesso(num) {
		if (numeri.includes(num)) {
			return false;
		}
		if (!tutte_le_decine) {
			if (numeri.length >= 9) {
				tutte_le_decine = true;
			}
		}
		let presenti = 0
		for (let i = 0; i < numeri.length; i++) {
			if (colonna(num) == colonna(numeri[i])) {
				if (!tutte_le_decine) {
					// completo tutte le decine prima di permettere altri numeri nella stessa decina
					return false;
				}
				presenti++;
				if (presenti > 2) {
					return false;
				}
			} 
		}
		return true;
	}

	function colonna(num) {
		if (num == 90) {
			return "8";
		} else {
			return String(Math.floor(num / 10));
		}
	}

	function scegli_righe(array_riga, n) {
	return [...array_riga]              // copia dell’array
		.sort((a, b) => a[1] - b[1])      // ordina per indice 1
		.slice(0, n)                     // prende i primi n
		.sort((a, b) => a[0] - b[0]);      // ordina per indice 0
	}

//]]>-->
</script>
